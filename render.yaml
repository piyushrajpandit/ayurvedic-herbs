services:
  - type: web
    name: ayush-plant-ml-api
    env: python
    region: singapore
    plan: free
    rootDir: ayush-plant-ml-api
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: HF_MODEL_NAME
        value: iamudit02/ayurvedic-herbs-vit
